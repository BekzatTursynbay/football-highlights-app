<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Match Highlight</title>

    <style>
      body {
        margin: 0;
        background: #e8f5e9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        overflow: hidden;
      }

      .video-wrapper {
        position: relative;
        width: 100vw;
        max-width: 1000px;
        aspect-ratio: 16 / 9;
        background: black;
        overflow: hidden;
      }

      @media (orientation: landscape) and (max-width: 1024px) {
        .video-wrapper {
          width: calc(100dvh * 16 / 9);
          max-width: 100vw;
        }
      }

      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      .blur-overlay {
        position: absolute;
        z-index: 10;
        pointer-events: all;
        user-select: none;
        background: rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .blur-overlay.visible {
        opacity: 1;
      }

      .blur-overlay-top {
        top: 0;
        left: 0;
        width: 80%;
        height: 10%;
      }

      .blur-overlay-bottom {
        bottom: 0;
        right: 0;
        width: 40%;
        height: 40%;
      }

      @media (max-width: 600px) {
        .blur-overlay-top {
          height: 15%;
        }
      }

      /* Mascot */
      .mascot {
        position: fixed;
        bottom: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        z-index: 100;
        user-select: none;
      }

      .mascot-bubble {
        background: rgba(255, 255, 255, 0.85);
        color: #1b3a10;
        font-family: system-ui, sans-serif;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.4;
        padding: 14px 20px;
        border-radius: 14px 14px 14px 4px;
        max-width: 300px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        animation: fadeMsg 0.5s ease;
      }

      @keyframes fadeMsg {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .mascot-avatar {
        width: 360px;
        height: auto;
        animation: bounce 2.4s ease-in-out infinite;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @media (max-width: 600px) {
        .mascot {
          bottom: 12px;
          left: 12px;
        }
        .mascot-avatar {
          width: 220px;
        }
        .mascot-bubble {
          font-size: 15px;
          max-width: 220px;
        }
      }
    </style>
  </head>

  <body>
    <div class="video-wrapper" id="videoWrapper">
      <div class="blur-overlay blur-overlay-top" id="blurOverlayTop"></div>
      <div
        class="blur-overlay blur-overlay-bottom"
        id="blurOverlayBottom"
      ></div>

      <div id="player"></div>
    </div>

    <div class="mascot">
      <img class="mascot-avatar" src="actor.png" alt="mascot" />
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="watch.js"></script>
  </body>
</html>
